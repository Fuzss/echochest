org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
loom.ignoreDependencyLoomVersionValidation=true

# Mod Attributes
modId=echochest
modName=Echo Chest
modVersion=21.1.1
modAuthor=Fuzs
modDescription=A unique chest that collects all items dropped nearby. Very useful!
modLicense=MPL-2.0
modSourceUrl=https://github.com/Fuzss/echochest
modIssueUrl=https://github.com/Fuzss/echochest/issues
modUpdateUrl=https://raw.githubusercontent.com/Fuzss/modresources/main/update/echochest.json
modMavenGroup=fuzs.echochest
# "MATCH_VERSION" for a mod required on both sides, "IGNORE_SERVER_VERSION" for a server only mod, "IGNORE_ALL_VERSION" for a client only mod
modForgeDisplayTest=MATCH_VERSION
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
modFabricEnvironment=*

# Version Catalog
dependenciesVersionCatalog=1.21.1-SNAPSHOT
#dependenciesPuzzlesLibVersion=21.1.8
#dependenciesMinPuzzlesLibVersion=21.1.8

# Mod Publishing
projectReleaseType=release
